apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: bill-auditor
spec:
  replicas: 1
  selector:
    matchLabels: { app: ollama }
  template:
    metadata:
      labels: { app: ollama }
    spec:
      containers:
        - name: ollama
          image: ollama/ollama:latest
          ports:
            - containerPort: 11434
          volumeMounts:
            - name: models
              mountPath: /root/.ollama
          resources:
            requests: { cpu: "1", memory: "6Gi" }
            limits: { cpu: "4", memory: "10Gi" }
          readinessProbe:
            tcpSocket: { port: 11434 }
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: 11434 }
            initialDelaySeconds: 60
            periodSeconds: 30
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: ollama-models
---
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: bill-auditor
spec:
  selector: { app: ollama }
  ports:
    - port: 11434
      targetPort: 11434
