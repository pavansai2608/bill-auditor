apiVersion: apps/v1
kind: Deployment
metadata:
  name: retrieval-service
  namespace: bill-auditor
spec:
  replicas: 2
  selector:
    matchLabels: { app: retrieval-service }
  template:
    metadata:
      labels: { app: retrieval-service }
    spec:
      containers:
        - name: retrieval-service
          image: bill-auditor/retrieval-service:latest
          # minikube image load puts the image on the node; never pull it.
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef: { name: bill-auditor-config }
            - secretRef: { name: bill-auditor-secrets }
          resources:
            requests: { cpu: "500m", memory: "1Gi" }
            limits: { cpu: "1", memory: "2Gi" }
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 90
            periodSeconds: 30
          volumeMounts:
            - name: clause-data
              mountPath: /app/data/db
      volumes:
        - name: clause-data
          persistentVolumeClaim:
            claimName: clause-data
---
apiVersion: v1
kind: Service
metadata:
  name: retrieval-service
  namespace: bill-auditor
spec:
  selector: { app: retrieval-service }
  ports:
    - port: 8000
      targetPort: 8000
