apiVersion: apps/v1
kind: Deployment
metadata:
  name: retrieval-service
  namespace: bill-auditor
spec:
  # Two replicas is the right shape for this service - it is light, frequent and
  # stateless, and on a real cluster it is the one worth scaling. On a one-node
  # minikube it does not fit: ollama reserves 6Gi of ~12Gi allocatable, and the
  # second 1Gi replica pushed the node to 99% so the frontend could never be
  # scheduled at all. Both replicas would land on the same node here anyway.
  replicas: 1
  # maxSurge 0, because this node runs at ~92% of its memory requests. The
  # default rolling update starts the replacement pod before it stops the old
  # one, and that extra request does not fit: the new pod sits Pending and the
  # rollout never completes, which is the same "Insufficient memory" the
  # replica count above already had to work around. Stopping first frees the
  # request. A one-node cluster gains nothing from surging anyway - both pods
  # would land on the same node.
  strategy:
    rollingUpdate: { maxSurge: 0, maxUnavailable: 1 }
  selector:
    matchLabels: { app: retrieval-service }
  template:
    metadata:
      labels: { app: retrieval-service }
    spec:
      containers:
        - name: retrieval-service
          image: bill-auditor/retrieval-service:latest
          # minikube image load puts the image on the node; never pull it.
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef: { name: bill-auditor-config }
            - secretRef: { name: bill-auditor-secrets, optional: true }
          resources:
            requests: { cpu: "500m", memory: "1Gi" }
            # Four cores, not one, and not ten.
            #
            # This pod is the cross-encoder, which is ~99% of a search. At a
            # limit of 1 it spent 99% of its scheduling periods frozen: the
            # quota was gone in the first few milliseconds of each period and
            # the threads waited out the rest. Measured on the same image,
            # five real /search calls, cold cache:
            #
            #     cpu 1   85.14s per search   99% of periods throttled
            #     cpu 4   24.37s per search    2% of periods throttled
            #
            # Not ten, because a limit is not free: requests across the
            # namespace are 4,250m of the node's 10 cores, and the rest of that
            # headroom is what everything else - ollama especially - expands
            # into under load. Four is what the measurement paid for.
            #
            # This is the only knob. core/cpu.py reads the quota out of
            # /sys/fs/cgroup/cpu.max and sizes the torch thread pool from it,
            # so changing this number changes the thread count with it and
            # nothing else needs editing. Raising it is also safe to schedule:
            # the scheduler places pods by requests, and requests are untouched.
            limits: { cpu: "4", memory: "2Gi" }
          # Readiness, not liveness, gates traffic. /ready returns 503 until
          # bge-base and the cross-encoder are loaded - 44-74s cold - so no
          # request is routed to a pod that would make the caller wait for a
          # model load. failureThreshold covers that window; liveness stays on
          # /health so a slow warm-up cannot restart the pod it is waiting for.
          readinessProbe:
            httpGet: { path: /ready, port: 8000 }
            initialDelaySeconds: 10
            periodSeconds: 5
            # 5s x 36 = 3 minutes, which covers a load from local disk.
            # It was 15 minutes while a fresh pod downloaded the weights
            # first; they are baked into the image now, and HF_HUB_OFFLINE
            # means a pod cannot go back to downloading them by accident.
            failureThreshold: 36
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 90
            periodSeconds: 30
          volumeMounts:
            - name: clause-data
              mountPath: /app/data/db
            - name: retrieval-cache
              mountPath: /app/data/retrieval_cache
      volumes:
        - name: clause-data
          persistentVolumeClaim:
            claimName: clause-data
        - name: retrieval-cache
          persistentVolumeClaim:
            claimName: retrieval-cache
---
apiVersion: v1
kind: Service
metadata:
  name: retrieval-service
  namespace: bill-auditor
spec:
  selector: { app: retrieval-service }
  ports:
    - port: 8000
      targetPort: 8000
