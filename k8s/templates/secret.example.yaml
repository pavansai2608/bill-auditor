# TEMPLATE. Never applied by k8s/deploy.sh, and never filled in inside the repo.
#
# `deploy.sh` copies `k8s/*.yaml`, which does not descend into this directory,
# so nothing here reaches the cluster by accident - and nothing here can be
# clobbered by a deploy either.
#
# ---------------------------------------------------------------------------
# Create the real Secret from your local .env, without the key ever appearing
# in a file in this repository, in your shell history as a literal, or in a
# log line:
#
#   kubectl -n bill-auditor create secret generic bill-auditor-secrets \
#     --from-literal=BA_GROQ_API_KEY="$(grep '^BA_GROQ_API_KEY=' .env | cut -d= -f2-)" \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# Check it landed without printing it:
#
#   kubectl -n bill-auditor get secret bill-auditor-secrets \
#     -o jsonpath='{.data.BA_GROQ_API_KEY}' | base64 -d | wc -c     # expect 56
#
# ---------------------------------------------------------------------------
# The key name is BA_GROQ_API_KEY, not BA_LLM_API_KEY. `core/config.py` sets
# `env_prefix = "BA_"` and the field is `groq_api_key`, so BA_GROQ_API_KEY is
# the name pydantic-settings reads. The old placeholder in 01-config.yaml said
# BA_LLM_API_KEY, which nothing has ever read.
#
# It is typed `SecretStr`, so repr() and str() of the settings object print
# `**********` and it takes an explicit .get_secret_value() to read it - which
# happens in exactly one place.
apiVersion: v1
kind: Secret
metadata:
  name: bill-auditor-secrets
  namespace: bill-auditor
type: Opaque
stringData:
  BA_GROQ_API_KEY: "gsk_REPLACE_ME_DO_NOT_COMMIT_A_REAL_KEY"
