apiVersion: apps/v1
kind: Deployment
metadata:
  name: audit-service
  namespace: bill-auditor
spec:
  replicas: 2
  selector:
    matchLabels: { app: audit-service }
  template:
    metadata:
      labels: { app: audit-service }
    spec:
      containers:
        - name: audit-service
          image: bill-auditor/audit-service:latest
          # minikube image load puts the image on the node; never pull it.
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef: { name: bill-auditor-config }
            - secretRef: { name: bill-auditor-secrets }
          resources:
            requests: { cpu: "1", memory: "2Gi" }
            limits: { cpu: "3", memory: "4Gi" }
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 40
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 120
            periodSeconds: 30
          volumeMounts:
            - name: llm-cache
              mountPath: /app/data/llm_cache
      volumes:
        - name: llm-cache
          persistentVolumeClaim:
            claimName: llm-cache
---
apiVersion: v1
kind: Service
metadata:
  name: audit-service
  namespace: bill-auditor
spec:
  selector: { app: audit-service }
  ports:
    - port: 8000
      targetPort: 8000
