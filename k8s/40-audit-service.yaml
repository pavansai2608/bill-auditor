apiVersion: apps/v1
kind: Deployment
metadata:
  name: audit-service
  namespace: bill-auditor
spec:
  # One, not two, and the reason is arithmetic rather than design. This service
  # asks for 2Gi - the largest request here - and a single-node minikube has
  # about 12Gi allocatable, of which ollama alone reserves 6Gi. At two replicas
  # the totals come to ~13.6Gi and the scheduler leaves pods Pending forever,
  # which is what "0/1 nodes are available: 1 Insufficient memory" meant.
  # A second replica on a one-node cluster buys no availability anyway: it lands
  # on the same node. Raise this on a real multi-node cluster.
  replicas: 1
  selector:
    matchLabels: { app: audit-service }
  template:
    metadata:
      labels: { app: audit-service }
    spec:
      containers:
        - name: audit-service
          image: bill-auditor/audit-service:latest
          # minikube image load puts the image on the node; never pull it.
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef: { name: bill-auditor-config }
            - secretRef: { name: bill-auditor-secrets }
          resources:
            requests: { cpu: "1", memory: "2Gi" }
            limits: { cpu: "3", memory: "4Gi" }
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 40
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 120
            periodSeconds: 30
          volumeMounts:
            - name: llm-cache
              mountPath: /app/data/llm_cache
      volumes:
        - name: llm-cache
          persistentVolumeClaim:
            claimName: llm-cache
---
apiVersion: v1
kind: Service
metadata:
  name: audit-service
  namespace: bill-auditor
spec:
  selector: { app: audit-service }
  ports:
    - port: 8000
      targetPort: 8000
