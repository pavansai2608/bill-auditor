# The model is the big one: 5 GB, and it must not live in an image.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama-models
  namespace: bill-auditor
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 12Gi
---
# The Chroma collection and the BM25 index, written by ingestion and read by
# retrieval.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: clause-data
  namespace: bill-auditor
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
---
# Every model call is cached by prompt hash. Losing this only costs time, but
# it costs a lot of it.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: llm-cache
  namespace: bill-auditor
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
---
# Every search is cached by query, policy and a digest of the clause index.
# The same argument as llm-cache, for the other 90% of an audit: with the model
# calls served from disk, re-auditing one bill after a restart still cost 94.6s
# of searching. This is what removes it. Mounted on retrieval-service, which is
# the container that searches.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: retrieval-cache
  namespace: bill-auditor
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
