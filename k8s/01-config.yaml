# Every non-secret setting the services read.
#
# **Groq is the primary backend; Ollama is the fallback.** BA_LLM_BACKEND
# overrides the per-context defaults in core/config.py - which would otherwise
# give the API groq and everything else ollama - so every service in this
# cluster agrees on one backend with no code change.
#
# Ollama is not switched off by this. It stays deployed, stays reachable at
# BA_OLLAMA_BASE_URL, and core/llm.py falls back to it per call whenever Groq
# refuses: rate limit, quota exhaustion or a connection error. See
# `_invoke` and `_groq_down_until`.
apiVersion: v1
kind: ConfigMap
metadata:
  name: bill-auditor-config
  namespace: bill-auditor
data:
  # The backend every service uses first.
  BA_LLM_BACKEND: "groq"
  BA_GROQ_MODEL: "openai/gpt-oss-120b"

  # The fallback. Kept running on purpose: a free tier that ends mid-audit
  # must not end the audit.
  BA_OLLAMA_BASE_URL: "http://ollama:11434"
  BA_OLLAMA_MODEL: "qwen3:8b"

  BA_NUM_CTX: "8192"
  BA_TEMPERATURE: "0.0"
  BA_KEEP_ALIVE: "30m"
  BA_RETRIEVAL_URL: "http://retrieval-service:8000"
  BA_AUDIT_URL: "http://audit-service:8000"
  BA_INGESTION_URL: "http://ingestion-service:8000"
  # Lines judged at once. 0 resolves to 2, from the literal `return 2` in
  # core.audit.worker_count(). It does not vary by backend - see the
  # measurement in that docstring, and tests/test_workers.py.
  BA_AUDIT_WORKERS: "0"
  BA_LOG_LEVEL: "INFO"
  BA_CORS_ORIGINS: '["http://localhost:5173","http://localhost:3000"]'
#
# THE SECRET IS NOT IN THIS FILE, AND NOT IN ANY FILE THIS DIRECTORY APPLIES.
#
# It used to be, as a commented placeholder, and that was a trap: `kubectl
# apply` reconciles a Secret to the state the manifest declares, so every
# deploy would have wiped a key someone had put in the cluster by hand.
#
# `k8s/deploy.sh` runs `cp k8s/*.yaml`, which does not recurse, so
# `k8s/templates/secret.example.yaml` is never copied and never applied. Create
# the real Secret out of band - the command is in that file.
