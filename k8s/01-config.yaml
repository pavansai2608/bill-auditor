# Every setting the services read. Changing the LLM backend is a change to
# BA_OLLAMA_BASE_URL here and nothing else - point it at a hosted model and no
# pod has to run an 8B model.
apiVersion: v1
kind: ConfigMap
metadata:
  name: bill-auditor-config
  namespace: bill-auditor
data:
  BA_OLLAMA_BASE_URL: "http://ollama:11434"
  BA_OLLAMA_MODEL: "qwen3:8b"
  BA_NUM_CTX: "8192"
  BA_TEMPERATURE: "0.0"
  BA_KEEP_ALIVE: "30m"
  BA_RETRIEVAL_URL: "http://retrieval-service:8000"
  BA_AUDIT_URL: "http://audit-service:8000"
  BA_INGESTION_URL: "http://ingestion-service:8000"
  # Lines judged at once. Blank or 0 asks the backend: 4 on Groq, 2 on Ollama.
  BA_AUDIT_WORKERS: "0"
  BA_LOG_LEVEL: "INFO"
  BA_CORS_ORIGINS: '["http://localhost:5173","http://localhost:3000"]'
---
# A template. Nothing here is secret today - the whole system is local models
# and local files - but a hosted LLM backend would need a key, and it belongs
# here rather than in the ConfigMap.
#
#   cp k8s/01-config.yaml /tmp/secret.yaml, fill it in, apply that copy.
#   Never commit a filled-in version.
apiVersion: v1
kind: Secret
metadata:
  name: bill-auditor-secrets
  namespace: bill-auditor
type: Opaque
stringData:
  # BA_LLM_API_KEY: "replace-me-only-if-you-point-at-a-hosted-model"
  placeholder: "not-a-secret"
