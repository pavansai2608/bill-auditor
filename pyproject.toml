[project]
name = "bill-auditor"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "pavansai2608", email = "golipavansaikrishna2608@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "chromadb>=1.5.9",
    "langchain>=1.3.18",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-ollama>=1.1.0",
    "langgraph>=1.2.11",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=6.0.1",
]

[project.scripts]
bill-auditor = "bill_auditor:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pybuilder>=0.13.21",
    "pytest>=9.1.1",
    "ruff>=0.16.5",
    "selenium>=4.48.0",
]
