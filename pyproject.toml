[project]
name = "bill-auditor"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "pavansai2608", email = "golipavansaikrishna2608@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "chromadb>=1.5.9",
    "langchain>=1.3.18",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-ollama>=1.1.0",
    "langgraph>=1.2.11",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=6.0.1",
]

[project.scripts]
bill-auditor = "bill_auditor:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pybuilder>=0.13.21",
    "pytest>=9.1.1",
    "ruff>=0.16.5",
    "selenium>=4.48.0",
]

[tool.ruff]
line-length = 100
target-version = "py314"
exclude = [".venv", "data", "frontend", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "PTH", "RUF"]
ignore = [
    "E501",     # line length is handled by the formatter
    "RUF012",   # pydantic/langchain class attrs are not ClassVar
    "B008",     # FastAPI Depends() in defaults is idiomatic
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
"eval/*" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
