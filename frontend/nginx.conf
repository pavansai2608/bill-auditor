server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Vite hashes every asset name, so they can be cached hard.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # A single-page app: every unknown path is the app, not a 404.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
