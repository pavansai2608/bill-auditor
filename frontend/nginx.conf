server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Vite hashes every asset name, so they can be cached hard.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # A single-page app: every unknown path is the app, not a 404.
  #
  # index.html must never be cached. It is the only unhashed file served, and
  # it is what names the hashed bundles - so a browser holding an old copy of
  # it goes on requesting the old /assets/index-<hash>.js for ever, and a
  # deploy is invisible no matter how many times the container is rebuilt.
  # Without an explicit directive nginx sends only ETag and Last-Modified, and
  # the browser is free to apply heuristic freshness and not revalidate at all.
  # That is exactly how a redesign shipped and nobody could see it.
  location = /index.html {
    add_header Cache-Control "no-cache, must-revalidate";
  }

  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache, must-revalidate";
  }
}
