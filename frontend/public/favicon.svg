<!-- The wordmark from src/components/icons.tsx, drawn at tab size: a sheet of
     paper with three ruled lines and one stroke through them. A bill, and a
     deduction taken off it.

     Stroke rather than fill, on the brand blue, on a rounded ground - a
     transparent icon disappears against a dark browser chrome, and this is
     the one place the mark cannot inherit a colour from the page. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" width="20" height="20">
  <rect width="20" height="20" rx="4.5" fill="#0b5fcb"/>
  <g fill="none" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
    <rect x="5.1" y="3.4" width="9.8" height="13.2" rx="1.8"/>
    <path d="M7.6 7.4h4.8M7.6 10.2h4.8M7.6 13h2.6"/>
    <path d="M6.6 14.6 13.4 8.6" stroke-width="1.6"/>
  </g>
</svg>
